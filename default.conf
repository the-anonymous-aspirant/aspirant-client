# Edge banner suppression (system_3 #3866, CWE-200 — audit §3.4 D1/D2).
# conf.d files are included at http level, so both directives inherit into
# every server block and location in this file. server_tokens strips the
# nginx version from the Server header and error pages; proxy_hide_header
# drops the Server banner each proxied upstream (Penpot, Histoire, the
# explorer, system_3, the API) would otherwise advertise through this hop.
# Belt-and-suspenders with the upstreams' own --no-server-header work
# (#3796-A3): the edge stays clean even when an upstream forgets.
server_tokens off;
proxy_hide_header Server;

# Request duration at the edge (system_3 #7016, under epic #7013).
#
# The image's own `main` format (/etc/nginx/nginx.conf) logs $status and
# $body_bytes_sent and NO duration, so whole-cell *latency* has had no reader
# at all -- the dismissal system_3's health catalogue has carried since
# #5528-A1 §7. $status was always there, so Errors and Traffic never needed
# this; latency is the one group that did.
#
# Three mechanics decide the shape below, and two of them were measured
# against a throwaway nginx container rather than reasoned about, because the
# first two attempts at this change were both wrong:
#
# 1. A new format NAME is required. nginx rejects a duplicate outright --
#      nginx: [emerg] duplicate "log_format" name "main" in /etc/nginx/conf.d/...
#    -- so redefining the image's `main` in place is not available. Declaring
#    `main_timed` here is, because conf.d files are included at http level
#    (the banner comment above relies on the same property).
#
# 2. The access_log goes in each SERVER block, not here beside the format. A
#    second access_log at the SAME level does not replace the first, it ADDS,
#    and nginx writes the request twice -- measured: one request emitted both
#      127.0.0.1 - - [...] "GET / HTTP/1.1" 200 896 "-" "Wget" "-"
#      127.0.0.1 - - [...] "GET / HTTP/1.1" 200 896 "-" "Wget" "-" rt=0.000
#    which would have doubled every count the #7017 collector reads and
#    double-counted every error. A server-level access_log DOES replace the
#    inherited http-level one, so declaring it per server gives exactly one
#    line per request, in the new format.
#
# 3. `access_log off;` is not the way to retire the inherited line. It is
#    documented as cancelling all access_log directives on the current level,
#    and it does so regardless of order -- an `off` followed by a replacement
#    at the same level logs NOTHING at all (measured: zero access lines). That
#    is why there is no `off` here.
#
# Why `rt=` and not a bare trailing number: the consuming collector
# (system_3 #7017) parses these lines positionally, and a labelled suffix is
# unambiguous -- it cannot be mistaken for $http_x_forwarded_for's neighbour,
# it survives a future field being appended after it, and it lets the parser
# treat the duration as optional-if-present, so the pre-rollout lines still in
# the container's log ring parse correctly instead of counting as unparsed.
#
# $request_time is seconds with millisecond resolution (e.g. 0.004), measured
# from the first byte read from the client to the last byte sent. It is the
# time the EDGE took, which for a proxied route includes the upstream; it is
# not a substitute for an upstream's own timing.
#
# Field order ahead of the suffix is byte-identical to `main` on purpose, so
# one parser reads both formats.
#
# Member address (X-Forwarded-For) is intentionally dropped: the slot logs the
# literal "-", not $http_x_forwarded_for (system_3 #7025). Behind Cloudflare the
# member's own IP arrives only in XFF -- $remote_addr is always a Cloudflare edge
# address -- so this is the one field at this hop carrying member PII, and it has
# no sanctioned reader: abuse control rate-limits on the live request header in
# aspirant-server (rate_limit.go, c.ClientIP()), not on this log, and #7017
# stores counts only. Keeping it was unanalysed retention of personal data in a
# log ring, against the no-IP-retention posture on system_3 #5120. The "-"
# placeholder keeps the field COUNT identical, so #7017's positional parser and
# the pre-rollout lines in the log ring are unaffected.
#
# CONDITION -- do not remove without re-deciding #7025: $remote_addr is safe to
# log ONLY while no real_ip directive is configured. Adding
#   set_real_ip_from <cloudflare ranges>; real_ip_header X-Forwarded-For;
# rewrites $remote_addr to the member's real IP, re-introducing member PII through
# the $remote_addr field below that this change leaves in place -- while this XFF
# slot still reads "-" and looks sanitised. The break-glass maps $break_glass_header
# and $break_glass_port_refused (lines 126 and 131) also depend on $remote_addr:
# if X-Forwarded-For could reach $remote_addr, the source check would be bypassed.
# Any future real_ip change must drop or hash $remote_addr AND switch the break-
# glass maps to a header that cannot be forged.
log_format  main_timed  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "-" '
                        'rt=$request_time';

# WebSocket upgrade pass-through for the Penpot location below. Maps to
# "close" when the client sent no Upgrade header, per the nginx docs
# pattern; conf.d files are included at http level so `map` is legal here.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Did the CLIENT reach us over plaintext? (system_3 #2463)
#
# `$scheme` is useless for this: Cloudflare terminates TLS and speaks http to
# the origin, so $scheme is ALWAYS "http" here regardless of what the browser
# used. Keying an upgrade off it would redirect https requests to https for
# ever. Cloudflare sets X-Forwarded-Proto to the scheme the *client* used,
# which is the only signal at this hop that distinguishes them.
#
# The empty default is deliberate and load-bearing: a request with no
# X-Forwarded-Proto did not come through Cloudflare — container healthchecks,
# compose-internal calls, direct origin hits — and must NOT be redirected.
# Redirecting those would break liveness probes to fix a browser-facing defect.
map $http_x_forwarded_proto $client_used_plaintext {
  default 0;
  http    1;
}

# The break-glass marker aspirant-server accepts in place of a Cloudflare
# Access assertion on the admin sign-in only (system_3 #8798, #9270). It is
# non-empty only on the 8098 listener, and only for the source below;
# $server_port is the port the connection was accepted on and $remote_addr the
# peer, neither of which a client can choose. The value
# is a secret from the secrets drop-in (see `set $break_glass_token` below),
# and only `location = /admin/sign-in` sends it upstream. Every other proxying
# location clears the header, so the token never reaches Penpot, the explorer
# or the system_3 console.
#
# Keyed on the source as well as the port (security c57573 on #9288): the
# 127.0.0.1 publish limits the HOST side only, and every container on the
# compose network reaches this container's 8098 directly. Host traffic through
# the publish arrives from the bridge gateway, 172.18.0.1 (docker-proxy; the
# same address the system_3 locations below proxy to), so only
# "8098:172.18.0.1" gets the token, and any other source on 8098 is refused
# ($break_glass_port_refused). In a map, exact keys win over regexes.
map "$server_port:$remote_addr" $break_glass_header {
  default            "";
  "8098:172.18.0.1"  $break_glass_token;
}

map "$server_port:$remote_addr" $break_glass_port_refused {
  default            0;
  "~^8098:"          1;
  "8098:172.18.0.1"  0;
}

# Resource-restricting Content-Security-Policy, REPORT-ONLY (system_3 #9106,
# operator-approved on #7285 c56043). The browser blocks nothing under this
# header; it logs to the console what an enforcing policy would have refused.
# Enforcing it is a separate operator question, asked once it has run clean.
#
# The allowlist is the aspirant SPA's and the static pages nginx serves itself,
# built from the deployed bundle and the served HTML, not from memory:
#   script-src  inline scripts by hash only: index.html's pre-paint theme
#               setter (#4245) and the birthday invitation page's video
#               script (#2846). scripts/check-csp-hashes.mjs fails the image
#               build when a served page's inline script and these drift.
#   style-src   'self' only (#9132). The bundle has no parser-inserted style:
#               About's swatches are classes, and the rulebook and invitation
#               pages link their CSS. Vue sets template styles through the
#               CSSOM, which CSP allows; a large static chunk it turns into an
#               innerHTML string is parser-inserted, so a static style="" there
#               would be reported (that is how About's 8 surfaced).
#   img-src     blob: for assets read through /api/fetch-object and for the
#               QR codes the site draws itself (src/utils/qr.js; #9132 dropped
#               api.qrserver.com).
#   connect-src raw.githubusercontent.com (RemarkablePdfs' planner generator).
#   frame-src   'self' for the rulebook and legacy browser-flows frames, blob:
#               for the invoice and asset PDF previews.
#   media-src   blob: for the game sounds read through /api/fetch-object.
# No report-uri / report-to on purpose: collecting reports would send member
# page URLs to an endpoint we would then have to retain.
#
# Scoped by the LOCATION that serves the response, not by the URI (#9132).
# Only the SPA's `location /` and the invitation page's exact location set
# $csp_surface to `spa`; the server block defaults it to "", so every other
# location (the proxied admin apps, /api/, browser-flows) gets an empty value
# and nginx omits the header. Penpot, Histoire, the explorer, system_3 and
# browser-flows each need their own allowlist (the #3020 note in the server
# block); this policy is the SPA's.
#
# The first version keyed this map on the raw $request_uri, which nginx does
# not route on: it decodes %2f and resolves `..` and `//` before matching a
# location. So /admin/penpot/..%2f..%2flogin was served by the SPA with the
# exclusion applied (no policy), and //admin/penpot/ reached Penpot WITH the
# SPA's policy. Security's review of PR 356 found both; the #9106 production
# walk confirmed them (system_3 #9132 c56224). A location-level `set` does not
# drop the server-level add_header lines, so nothing is duplicated.
map $csp_surface $csp_report_only {
  default "";
  spa "default-src 'self'; script-src 'self' 'sha256-KPW2aHlfBSWp27FVKENpLsTQh2JNHUqNnDQYsZXWOSk=' 'sha256-hi5FagYYu6q2Ig7VJ2HzcyaieYuKQz1IPvn+auQKdHI='; style-src 'self'; connect-src 'self' https://raw.githubusercontent.com; img-src 'self' blob:; font-src 'self'; frame-src 'self' blob:; media-src 'self' blob:; worker-src 'self'";
}

server {
  listen 80 default_server;
  # Break-glass (system_3 #8798): the same vhost on a loopback-only port, so the
  # SSH tunnel reaches every admin tool through one listener and nothing is
  # duplicated. aspirant-deploy publishes it as 127.0.0.1:8098:8098 (explicit
  # IPv4 host IP, so no [::] docker-proxy); see $break_glass_header above.
  listen 8098;

  # Replaces the inherited http-level access_log rather than adding to it;
  # see the main_timed note at the top of this file (#7016).
  access_log /var/log/nginx/access.log main_timed;
  client_max_body_size 25m;

  # Emit RELATIVE Location headers. (system_3 #2463 — the defect this fixes.)
  #
  # nginx absolutises a relative redirect using $scheme://$host, and $scheme is
  # "http" at this hop (see the map above). So the bare `return 302` redirects
  # in this file — five of them — sent an absolute `Location: http://...` to
  # requests that had ARRIVED OVER TLS. The server was performing the
  # downgrade; the user did nothing wrong. A relative Location makes the
  # browser reuse the scheme it already had, which is correct for every one of
  # these redirects and cannot regress if a sixth is added later.
  absolute_redirect off;

  # Security response headers (system_3 #3020 — OWASP Secure Headers Project;
  # CWE-1021 clickjacking, CWE-693 protection-mechanism failure). Defence-in-
  # depth for the same-origin admin surfaces now mounted under /admin/ (Penpot,
  # Histoire, system_3): before these, the apex served only its own SPA; a
  # missing header mattered less.
  #
  # Placed at server{} level so it inherits into every location — nginx only
  # drops inherited add_header when a location sets its OWN add_header, and none
  # here do, so this one block covers the SPA catch-all, the proxied admin apps,
  # and the redirects alike. `always` so the headers also ride the auth-gate
  # 302s and any 4xx/5xx, not just 2xx/3xx.
  #
  # Directive scope is deliberate: the framing / MIME-sniffing / referrer /
  # base-tag / plugin class only — the controls that are safe across the lean
  # Vue SPA AND the proxied third-party apps alike. A resource-restricting
  # content CSP (default-src / script-src / connect-src / worker-src …) is NOT
  # set here: Penpot (wasm, web workers, its own websocket) and the Vite SPA
  # each need a different allowlist, and this vhost cannot exercise them from
  # here, so a blanket policy would risk silently breaking an embedded app. That
  # belongs in a per-surface follow-up with each upstream enumerated and tested.
  # The SPA's own follow-up is the report-only header below (#9106), which the
  # $csp_report_only map leaves off every proxied app.
  #
  # X-Frame-Options is SAMEORIGIN, not DENY: an embedded app may legitimately
  # frame its own same-origin content, and DENY would break that. `frame-
  # ancestors 'self'` is the modern equivalent; X-Frame-Options covers legacy
  # browsers that predate CSP frame-ancestors.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  # The SPA's resource-restricting policy, report-only; see the map at the top
  # of this file (#9106). Empty, so omitted, unless the serving location set
  # $csp_surface to `spa` (#9132). Default it here, so every other location
  # reads "" rather than an uninitialised variable.
  set $csp_surface "";
  add_header Content-Security-Policy-Report-Only $csp_report_only always;
  # Permissions-Policy is a deny-list of powerful features no surface here uses:
  # the lean Vue SPA and the proxied admin apps request none of these. Safe to
  # deny outright across the vhost (unlike a resource-restricting content CSP,
  # which needs per-app allowlists — see above). clipboard-write / fullscreen are
  # deliberately NOT denied: Penpot uses both, and denying them would break it.
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

  # HSTS (system_3 #3050 — OWASP ASVS V14.4 / CWE-693). Tells the browser to
  # use HTTPS for this host for a year, so a later plaintext request never
  # leaves the machine. Cloudflare terminates TLS and forwards origin response
  # headers to the browser over HTTPS, so emitting it here reaches the client
  # on the secure hop; on the residual direct-origin :80 responses it is inert
  # (RFC 6797 §8.1 — a UA ignores HSTS received over plaintext) but harmless,
  # and its presence is what the sweep's `transport.hsts_present` probe checks.
  # 31536000s = 1 year, comfortably above the 15552000 (180d) floor.
  #
  # `includeSubDomains` / `preload` are deliberately NOT set: they would bind
  # every *.the-aspirant.com host (and, for preload, bake it into browsers
  # irreversibly) before each subdomain's plaintext exposure has been
  # enumerated — the same per-surface-enumeration caution the content-CSP is
  # deferred for above. A widen-the-scope follow-up is an operator call.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Upgrade plaintext to TLS. Runs before any location so it covers the whole
  # vhost, including the admin prefixes and the SPA catch-all.
  #
  # The apex is spelled out rather than reflected from $host (system_3 #2558).
  # This vhost is `default_server` with no server_name, so it answers to ANY
  # Host and $host would put the client's own header in the Location — an open
  # redirect. Cloudflare constrains the Host to the zone, so nothing legitimate
  # changes: the-aspirant.com is the only proxied hostname, and the two named
  # vhosts below already redirect to this same literal.
  if ($client_used_plaintext) {
    return 301 https://the-aspirant.com$request_uri;
  }

  # No legitimate client sends the break-glass marker: nginx sets it, on 8098
  # only. Refuse one a client supplies, on either port, rather than relying
  # only on every location clearing it (system_3 #9270).
  if ($http_x_aspirant_break_glass) {
    return 403;
  }

  # The break-glass port answers the bridge gateway only, where the host's
  # 127.0.0.1:8098 publish arrives; a sibling container reaching 8098 directly
  # is refused (security c57573). See $break_glass_port_refused above.
  if ($break_glass_port_refused) {
    return 403;
  }

  # Docker embedded DNS. Re-resolve upstream service names on every request so
  # nginx does not cache a stale container IP when a proxied backend (server,
  # browser) is recreated. Without this, requests return 502 until this
  # container is manually restarted. Variable proxy_pass forces the lookup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_server server:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_server;
    proxy_set_header X-Aspirant-Break-Glass "";
    # Overwrite, not append (system_3 #8802): the client sets its own
    # X-Forwarded-For, and aspirant-server trusts every proxy (gin's
    # default with no SetTrustedProxies call), so a self-chosen XFF picked
    # the key of the per-IP login/signup rate-limit buckets
    # (rate_limit.go's ClientIP()). The only path onto :80/:8999 is
    # Cloudflare (DOCKER-USER admits Cloudflare ranges + the docker
    # bridges only), so $http_cf_connecting_ip is the one header this hop
    # can trust; proxy_set_header replaces whatever the client sent rather
    # than appending to it.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
  }

  # The admin sign-in (system_3 #8798, #9270). It sits under /admin so the
  # /admin Cloudflare Access application covers it: Cloudflare attaches the
  # Cf-Access-Jwt-Assertion that aspirant-server's POST /login/admin checks
  # before it issues the Admin tier. The browser's own headers pass through
  # unchanged, as on /api/. The only location that sends the break-glass marker
  # upstream, and it is non-empty only on the 8098 listener.
  location = /admin/sign-in {
    limit_except POST { deny all; }
    set $upstream_server server:8080;
    rewrite ^ /login/admin break;
    proxy_pass http://$upstream_server;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Aspirant-Break-Glass $break_glass_header;
    proxy_read_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
  }

  # aspirant-browser serves the matrix and per-flow detail HTML directly
  # under /browser-flows. Gate the whole prefix on an Admin JWT via nginx
  # auth_request against aspirant-server — matrix HTML would otherwise be
  # world-readable, since aspirant-browser has no auth middleware. The
  # JSON API at /api/browser-flows is separately auth'd behind /api/.
  location /browser-flows {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @browser_flows_login;
    set $upstream_browser browser:8000;
    proxy_pass http://$upstream_browser;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
  }

  # Internal subrequest target — validates the caller's auth_token cookie
  # (or Authorization header) has role=Admin. 200 lets the parent request
  # proceed; 401/403 triggers the error_page → /login redirect above.
  location = /_internal/verify-admin {
    internal;
    set $upstream_verify server:8080;
    rewrite ^ /internal/verify-admin break;
    proxy_pass http://$upstream_verify;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
  }

  # Target the dedicated /login page (system_3 #3342), not `/`: `/login` used
  # to fall through the Vue router to the `:pathMatch(.*)*` catch-all and
  # render NotFound because no /login route existed (system_3 #2602, found by
  # the operator during the #2517 walk); that dead end was fixed by
  # redirecting to `/` instead, which worked but stranded the visitor on the
  # home page rather than a focused login form. `redirect=$request_uri`
  # carries the originally requested path so LoginView.vue can send the
  # visitor back to it after a successful login instead of dropping them on
  # `/`.
  #
  # This was invisible for as long as it existed because every test of these
  # surfaces ran from an already-authenticated session; only an unauthenticated
  # visitor ever reaches the redirect.
  location @browser_flows_login {
    return 302 /admin/login?redirect=$request_uri;
  }

  # Penpot, mounted same-origin under the admin path (system_3 #2198,
  # operator direction: path over subdomain; the admin tile opens it in a
  # new tab). Verified on 2.16.2: relative assets + hash routing + a
  # path-bearing public URI (config.js override below + backend
  # PENPOT_PUBLIC_URI) keep every request — API, websocket, signed asset
  # URLs — inside this prefix.
  location = /admin/penpot { return 302 /admin/penpot/; }

  # The image's js/config.js is inert comments; short-circuit it to point the
  # SPA at the path-bearing public URI. Keeps the stock frontend image.
  location = /admin/penpot/js/config.js {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    default_type application/javascript;
    return 200 'var penpotPublicURI = "https://the-aspirant.com/admin/penpot/";\n';
  }

  location /admin/penpot/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    # Design asset uploads and .penpot imports exceed the apex 25m cap.
    client_max_body_size 100m;
    set $upstream_penpot penpot-frontend:8080;
    rewrite ^/admin/penpot/(.*)$ /$1 break;
    proxy_pass http://$upstream_penpot;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Long-lived notifications websocket: upgrade headers + a read timeout
    # comfortably above Penpot's own keepalive pings.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location @penpot_login {
    return 302 /admin/login?redirect=$request_uri;
  }

  # Histoire component workbench (system_3 #2218), same admin-gated
  # pattern as Penpot above. The image serves the app at its real
  # public path (base baked at build time), so no prefix rewriting —
  # pass the URI through as-is.
  location = /admin/histoire { return 302 /admin/histoire/; }

  location /admin/histoire/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    set $upstream_histoire histoire:80;
    proxy_pass http://$upstream_histoire;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Data-lake explorer (system_3 #2409/#2541), same admin-gated pattern as
  # Histoire above. Reachability, not network membership, is the boundary the
  # operator ruling governs (docker-compose.yml's explorer-api comment):
  # public ingress may reach the mediating `explorer`/`explorer-api` pair,
  # but no lake service (garage, catalog) may ever be reachable by any route.
  # Neither location below proxies anywhere near the lake bridge directly.
  #
  # `explorer` (the SPA) uses the histoire non-rewriting idiom: EXPLORER_BASE
  # is baked into the image as /admin/explorer/ (Dockerfile-ExplorerFrontend),
  # so the built asset URLs already carry the prefix and proxy_pass with no
  # URI component passes the request straight through unchanged.
  location = /admin/explorer { return 302 /admin/explorer/; }

  location /admin/explorer/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    set $upstream_explorer explorer:8080;
    proxy_pass http://$upstream_explorer;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # explorer-api's own routes are unprefixed (/api/health, /api/overview, …
  # — app/routes.py), unlike the SPA which is base-aware, so this location
  # strips the /admin/explorer/ prefix — the same prefix-STRIPPED shape as
  # the system_3 API location below. Longest-prefix matching sends this
  # location past the SPA location above for anything under .../api/.
  #
  # The strip is an explicit `rewrite`, NOT a URI part on proxy_pass: with a
  # variable upstream, proxy_pass does no prefix substitution — a URI part is
  # forwarded LITERALLY, so `http://$upstream/api/` sent every request to
  # `/api/` and the route suffix was dropped (found when D5's walk 404ed on
  # /admin/explorer/api/health; the upstream access log showed `GET /api/`).
  # The system_3 locations below keep the proxy_pass-URI idiom because their
  # upstream is a literal address, where substitution does happen.
  location /admin/explorer/api/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    # `set` before `rewrite`: both run in the rewrite phase in order, and the
    # `break` flag stops that phase — a `set` placed after it never executes.
    set $upstream_explorer_api explorer-api:8000;
    rewrite ^/admin/explorer/api/(.*)$ /api/$1 break;
    proxy_pass http://$upstream_explorer_api;
    proxy_set_header X-Aspirant-Break-Glass "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # system_3 fleet frontend + API (system_3 #2867), same admin-gated pattern
  # as Penpot/Histoire above. Unlike those, the upstream is NOT a compose
  # service: the system_3 backend is a host process (uvicorn bound to
  # 127.0.0.1:8000) reached through a host-side socat forwarder listening on
  # the docker bridge gateway 172.18.0.1:8000 — an address routable only from
  # this host and this compose network, so these auth_request locations are
  # the only external path to it. A literal IP needs no resolver/variable
  # (that trick exists to re-resolve compose service names).
  #
  # Shared-secret auth for that host process (system_3 #3019 / #3077-B2). The
  # backend's auth_middleware requires an `X-System3-Auth` header equal to
  # SYSTEM3_API_SECRET once enforcement is flipped (system_3 #3079-B4); it is
  # INERT until that env is set, so this can ship ahead of enforcement with zero
  # impact. This nginx — the one legitimate external caller — presents the header
  # on the three forwarded locations below. The secret is host-provisioned and
  # never baked into the image or committed: `$system3_auth` defaults to empty
  # here, and an operator drops in `/etc/nginx/secrets/<x>.conf` containing
  # `set $system3_auth "<secret>";` at flip time (a bind-mount, read-only). The
  # later `set` wins; the wildcard include matches ZERO files without error, so
  # the image boots clean pre-provision. An empty value makes nginx omit the
  # header entirely, so nothing changes on the wire until the secret is mounted.
  set $system3_auth "";
  # The break-glass token (system_3 #8798, #9270), from the drop-in
  # `break-glass.conf` in the same directory: `set $break_glass_token "<secret>";`.
  # It must equal aspirant-server's BREAK_GLASS_TOKEN. Absent drop-in = "",
  # which the server never accepts, so break-glass is off until it exists.
  set $break_glass_token "";
  include /etc/nginx/secrets/*.conf;
  location = /admin/apps/system_3 { return 302 /admin/apps/system_3/; }

  # Data plane, prefix STRIPPED: the backend serves /api and /conversation at
  # root, and the Vue app calls them base-relative (system_3 #2888). Longest-
  # prefix match sends these two past the static location below.
  location /admin/apps/system_3/api/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000/api/;
    proxy_set_header X-Aspirant-Break-Glass "";
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  # The legacy Jinja agent page, typed by URL (system_3 #8015, UX walk V1). The
  # prefix location below exists for the console's send
  # (`POST .../conversation/<agent>/send`), but it also exposed the backend's
  # pre-design-system HTML view at the bare `.../conversation/<agent>`, which
  # renders the old look and root-relative nav links that resolve to this SPA.
  # Send the operator to the console's agent page instead. Exactly one path
  # segment matches, so `/send`, `/transcript` and every other multi-segment
  # route still reach the prefix proxy unchanged (a regex location outranks a
  # non-`^~` prefix). `return` runs in the rewrite phase, before `auth_request`:
  # the 302 answers unauthenticated too, and reveals only the mapping of the URL
  # typed; the target stays behind verify-admin. Only GET/HEAD have a page to
  # land on; the one one-segment POST (`.../conversation/send`) belonged to the
  # Jinja composer this retires, so it gets 405.
  location ~ ^/admin/apps/system_3/conversation/(?<s3_legacy_agent>[A-Za-z0-9_.-]+)/?$ {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    return 302 /admin/apps/system_3/agents/$s3_legacy_agent;
  }

  location /admin/apps/system_3/conversation/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000/conversation/;
    proxy_set_header X-Aspirant-Break-Glass "";
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  # Static / SPA, prefix PRESERVED: the backend mounts the Vue dist at this
  # exact base (VUE_BASE, baked at build and boot — system_3 #2866-C).
  location /admin/apps/system_3/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000;
    proxy_set_header X-Aspirant-Break-Glass "";
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Standalone public birthday-invitation page (system_3 #2846). A dedicated
  # static route that lives OUTSIDE the SPA: no auth, no app shell, no Vue
  # router. The extensionless public URL must resolve to the .html file — the
  # `location /` catch-all below would otherwise send it through try_files to
  # /index.html and render the SPA's NotFound. `= ` makes this an exact match
  # so it wins over the prefix `location /`. The video asset next to it
  # (flowah_bday.mp4) has a real extension and is served fine by `location /`.
  location = /others/vinoly/2026_bday_invitation {
    set $csp_surface spa;
    root /usr/share/nginx/html;
    default_type text/html;
    try_files /others/vinoly/2026_bday_invitation.html =404;
  }

  # 301 redirects for renamed routes. Preserve bookmarks and the Cloudflare
  # cache when a page URL changes. Add one line per rename; the Vue catch-
  # all in src/router/router.js handles unknown paths that don't match here.
  rewrite ^/trusted/pappas-armhavningar/?$ /trusted/pappas-pushups permanent;

  # The SPA and the static files it ships (the rulebook page, assets): the
  # report-only policy applies here (#9132). try_files' /index.html fallback is
  # an internal redirect back into this location, so it sets this again.
  location / {
    set $csp_surface spa;
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# home.the-aspirant.com is the DIRECT, un-proxied hostname (system_3 #2557).
#
# It exists so SSH can reach the cell on 41922 without Cloudflare in the path,
# which means its A record points at the origin IP and any HTTP request to it
# arrives here having never touched Cloudflare's TLS. It therefore carries no
# X-Forwarded-Proto, so the upgrade added for #2463 deliberately skips it (that
# carve-out exists so container healthchecks are not redirected) — and the
# result was `http://home.the-aspirant.com/login` serving a 200 login form in
# cleartext, with Login.vue posting to a relative /api/login. A password typed
# there goes on the wire in the clear.
#
# There is no legitimate HTTP use of this hostname: it is the SSH entry point.
# So serve nothing over it — send every request to the apex over TLS.
#
# This is Host-based, so it does NOT touch the healthcheck carve-out: probes
# arrive with Host: localhost (or the container name) and continue to hit the
# default_server unredirected. Verified in the test plan.
#
# RESIDUAL, not closed here: a request to the origin IP with any other Host
# still lands on the default_server over plaintext. That is a network-boundary
# problem — the origin should not accept :80 from anything but Cloudflare — and
# it cannot be fixed in nginx, which is downstream of the connection being
# accepted. This block closes the discoverable, named path.
server {
  listen 80;
  server_name home.the-aspirant.com;

  # Replaces the inherited http-level access_log rather than adding to it;
  # see the main_timed note at the top of this file (#7016).
  access_log /var/log/nginx/access.log main_timed;

  # 301 rather than 308: these are GETs of a page, and a permanent redirect lets
  # browsers stop issuing the cleartext request at all after the first hit.
  return 301 https://the-aspirant.com$request_uri;
}

# Former Penpot vhost (system_3 #2195). Penpot moved to the same-origin
# /admin/penpot/app/ path above (#2198, operator direction) so it rides the
# apex's proven TLS/auth boundary instead of a second origin. The subdomain
# remains a plain redirect; the fragment (workspace deep links) survives the
# 302 because browsers re-apply it to the redirect target.
server {
  listen 80;
  server_name design.the-aspirant.com;

  # Replaces the inherited http-level access_log rather than adding to it;
  # see the main_timed note at the top of this file (#7016).
  access_log /var/log/nginx/access.log main_timed;

  location / {
    return 302 https://the-aspirant.com/admin/penpot/;
  }
}