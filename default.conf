# WebSocket upgrade pass-through for the Penpot location below. Maps to
# "close" when the client sent no Upgrade header, per the nginx docs
# pattern; conf.d files are included at http level so `map` is legal here.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Did the CLIENT reach us over plaintext? (system_3 #2463)
#
# `$scheme` is useless for this: Cloudflare terminates TLS and speaks http to
# the origin, so $scheme is ALWAYS "http" here regardless of what the browser
# used. Keying an upgrade off it would redirect https requests to https for
# ever. Cloudflare sets X-Forwarded-Proto to the scheme the *client* used,
# which is the only signal at this hop that distinguishes them.
#
# The empty default is deliberate and load-bearing: a request with no
# X-Forwarded-Proto did not come through Cloudflare — container healthchecks,
# compose-internal calls, direct origin hits — and must NOT be redirected.
# Redirecting those would break liveness probes to fix a browser-facing defect.
map $http_x_forwarded_proto $client_used_plaintext {
  default 0;
  http    1;
}

server {
  listen 80 default_server;
  client_max_body_size 25m;

  # Emit RELATIVE Location headers. (system_3 #2463 — the defect this fixes.)
  #
  # nginx absolutises a relative redirect using $scheme://$host, and $scheme is
  # "http" at this hop (see the map above). So the bare `return 302` redirects
  # in this file — five of them — sent an absolute `Location: http://...` to
  # requests that had ARRIVED OVER TLS. The server was performing the
  # downgrade; the user did nothing wrong. A relative Location makes the
  # browser reuse the scheme it already had, which is correct for every one of
  # these redirects and cannot regress if a sixth is added later.
  absolute_redirect off;

  # Security response headers (system_3 #3020 — OWASP Secure Headers Project;
  # CWE-1021 clickjacking, CWE-693 protection-mechanism failure). Defence-in-
  # depth for the same-origin admin surfaces now mounted under /admin/ (Penpot,
  # Histoire, system_3): before these, the apex served only its own SPA; a
  # missing header mattered less.
  #
  # Placed at server{} level so it inherits into every location — nginx only
  # drops inherited add_header when a location sets its OWN add_header, and none
  # here do, so this one block covers the SPA catch-all, the proxied admin apps,
  # and the redirects alike. `always` so the headers also ride the auth-gate
  # 302s and any 4xx/5xx, not just 2xx/3xx.
  #
  # Directive scope is deliberate: the framing / MIME-sniffing / referrer /
  # base-tag / plugin class only — the controls that are safe across the lean
  # Vue SPA AND the proxied third-party apps alike. A resource-restricting
  # content CSP (default-src / script-src / connect-src / worker-src …) is NOT
  # set here: Penpot (wasm, web workers, its own websocket) and the Vite SPA
  # each need a different allowlist, and this vhost cannot exercise them from
  # here, so a blanket policy would risk silently breaking an embedded app. That
  # belongs in a per-surface follow-up with each upstream enumerated and tested.
  #
  # X-Frame-Options is SAMEORIGIN, not DENY: an embedded app may legitimately
  # frame its own same-origin content, and DENY would break that. `frame-
  # ancestors 'self'` is the modern equivalent; X-Frame-Options covers legacy
  # browsers that predate CSP frame-ancestors.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  # Permissions-Policy is a deny-list of powerful features no surface here uses:
  # the lean Vue SPA and the proxied admin apps request none of these. Safe to
  # deny outright across the vhost (unlike a resource-restricting content CSP,
  # which needs per-app allowlists — see above). clipboard-write / fullscreen are
  # deliberately NOT denied: Penpot uses both, and denying them would break it.
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

  # HSTS (system_3 #3050 — OWASP ASVS V14.4 / CWE-693). Tells the browser to
  # use HTTPS for this host for a year, so a later plaintext request never
  # leaves the machine. Cloudflare terminates TLS and forwards origin response
  # headers to the browser over HTTPS, so emitting it here reaches the client
  # on the secure hop; on the residual direct-origin :80 responses it is inert
  # (RFC 6797 §8.1 — a UA ignores HSTS received over plaintext) but harmless,
  # and its presence is what the sweep's `transport.hsts_present` probe checks.
  # 31536000s = 1 year, comfortably above the 15552000 (180d) floor.
  #
  # `includeSubDomains` / `preload` are deliberately NOT set: they would bind
  # every *.the-aspirant.com host (and, for preload, bake it into browsers
  # irreversibly) before each subdomain's plaintext exposure has been
  # enumerated — the same per-surface-enumeration caution the content-CSP is
  # deferred for above. A widen-the-scope follow-up is an operator call.
  add_header Strict-Transport-Security "max-age=31536000" always;

  # Upgrade plaintext to TLS. Runs before any location so it covers the whole
  # vhost, including the admin prefixes and the SPA catch-all.
  #
  # The apex is spelled out rather than reflected from $host (system_3 #2558).
  # This vhost is `default_server` with no server_name, so it answers to ANY
  # Host and $host would put the client's own header in the Location — an open
  # redirect. Cloudflare constrains the Host to the zone, so nothing legitimate
  # changes: the-aspirant.com is the only proxied hostname, and the two named
  # vhosts below already redirect to this same literal.
  if ($client_used_plaintext) {
    return 301 https://the-aspirant.com$request_uri;
  }

  # Docker embedded DNS. Re-resolve upstream service names on every request so
  # nginx does not cache a stale container IP when a proxied backend (server,
  # browser) is recreated. Without this, requests return 502 until this
  # container is manually restarted. Variable proxy_pass forces the lookup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $upstream_server server:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$upstream_server;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
  }

  # aspirant-browser serves the matrix and per-flow detail HTML directly
  # under /browser-flows. Gate the whole prefix on an Admin JWT via nginx
  # auth_request against aspirant-server — matrix HTML would otherwise be
  # world-readable, since aspirant-browser has no auth middleware. The
  # JSON API at /api/browser-flows is separately auth'd behind /api/.
  location /browser-flows {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @browser_flows_login;
    set $upstream_browser browser:8000;
    proxy_pass http://$upstream_browser;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
  }

  # Internal subrequest target — validates the caller's auth_token cookie
  # (or Authorization header) has role=Admin. 200 lets the parent request
  # proceed; 401/403 triggers the error_page → /login redirect above.
  location = /_internal/verify-admin {
    internal;
    set $upstream_verify server:8080;
    rewrite ^ /internal/verify-admin break;
    proxy_pass http://$upstream_verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
  }

  # Target the dedicated /login page (system_3 #3342), not `/`: `/login` used
  # to fall through the Vue router to the `:pathMatch(.*)*` catch-all and
  # render NotFound because no /login route existed (system_3 #2602, found by
  # the operator during the #2517 walk); that dead end was fixed by
  # redirecting to `/` instead, which worked but stranded the visitor on the
  # home page rather than a focused login form. `redirect=$request_uri`
  # carries the originally requested path so LoginView.vue can send the
  # visitor back to it after a successful login instead of dropping them on
  # `/`.
  #
  # This was invisible for as long as it existed because every test of these
  # surfaces ran from an already-authenticated session; only an unauthenticated
  # visitor ever reaches the redirect.
  location @browser_flows_login {
    return 302 /login?redirect=$request_uri;
  }

  # Penpot, mounted same-origin under the admin path (system_3 #2198,
  # operator direction: path over subdomain; the admin tile opens it in a
  # new tab). Verified on 2.16.2: relative assets + hash routing + a
  # path-bearing public URI (config.js override below + backend
  # PENPOT_PUBLIC_URI) keep every request — API, websocket, signed asset
  # URLs — inside this prefix.
  location = /admin/penpot { return 302 /admin/penpot/; }

  # The image's js/config.js is inert comments; short-circuit it to point the
  # SPA at the path-bearing public URI. Keeps the stock frontend image.
  location = /admin/penpot/js/config.js {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    default_type application/javascript;
    return 200 'var penpotPublicURI = "https://the-aspirant.com/admin/penpot/";\n';
  }

  location /admin/penpot/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    # Design asset uploads and .penpot imports exceed the apex 25m cap.
    client_max_body_size 100m;
    set $upstream_penpot penpot-frontend:8080;
    rewrite ^/admin/penpot/(.*)$ /$1 break;
    proxy_pass http://$upstream_penpot;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # Long-lived notifications websocket: upgrade headers + a read timeout
    # comfortably above Penpot's own keepalive pings.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location @penpot_login {
    return 302 /login?redirect=$request_uri;
  }

  # Histoire component workbench (system_3 #2218), same admin-gated
  # pattern as Penpot above. The image serves the app at its real
  # public path (base baked at build time), so no prefix rewriting —
  # pass the URI through as-is.
  location = /admin/histoire { return 302 /admin/histoire/; }

  location /admin/histoire/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    set $upstream_histoire histoire:80;
    proxy_pass http://$upstream_histoire;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # system_3 fleet frontend + API (system_3 #2867), same admin-gated pattern
  # as Penpot/Histoire above. Unlike those, the upstream is NOT a compose
  # service: the system_3 backend is a host process (uvicorn bound to
  # 127.0.0.1:8000) reached through a host-side socat forwarder listening on
  # the docker bridge gateway 172.18.0.1:8000 — an address routable only from
  # this host and this compose network, so these auth_request locations are
  # the only external path to it. A literal IP needs no resolver/variable
  # (that trick exists to re-resolve compose service names).
  #
  # Shared-secret auth for that host process (system_3 #3019 / #3077-B2). The
  # backend's auth_middleware requires an `X-System3-Auth` header equal to
  # SYSTEM3_API_SECRET once enforcement is flipped (system_3 #3079-B4); it is
  # INERT until that env is set, so this can ship ahead of enforcement with zero
  # impact. This nginx — the one legitimate external caller — presents the header
  # on the three forwarded locations below. The secret is host-provisioned and
  # never baked into the image or committed: `$system3_auth` defaults to empty
  # here, and an operator drops in `/etc/nginx/secrets/<x>.conf` containing
  # `set $system3_auth "<secret>";` at flip time (a bind-mount, read-only). The
  # later `set` wins; the wildcard include matches ZERO files without error, so
  # the image boots clean pre-provision. An empty value makes nginx omit the
  # header entirely, so nothing changes on the wire until the secret is mounted.
  set $system3_auth "";
  include /etc/nginx/secrets/*.conf;
  location = /admin/apps/system_3 { return 302 /admin/apps/system_3/; }

  # Data plane, prefix STRIPPED: the backend serves /api and /conversation at
  # root, and the Vue app calls them base-relative (system_3 #2888). Longest-
  # prefix match sends these two past the static location below.
  location /admin/apps/system_3/api/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000/api/;
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  location /admin/apps/system_3/conversation/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000/conversation/;
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
  }

  # Static / SPA, prefix PRESERVED: the backend mounts the Vue dist at this
  # exact base (VUE_BASE, baked at build and boot — system_3 #2866-C).
  location /admin/apps/system_3/ {
    auth_request /_internal/verify-admin;
    error_page 401 403 = @penpot_login;
    proxy_pass http://172.18.0.1:8000;
    # Re-assert nginx's default Host (a location-level proxy_set_header disables
    # inheritance of the built-in default) and present the #3019 auth header.
    proxy_set_header Host $proxy_host;
    proxy_set_header X-System3-Auth $system3_auth;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # Standalone public birthday-invitation page (system_3 #2846). A dedicated
  # static route that lives OUTSIDE the SPA: no auth, no app shell, no Vue
  # router. The extensionless public URL must resolve to the .html file — the
  # `location /` catch-all below would otherwise send it through try_files to
  # /index.html and render the SPA's NotFound. `= ` makes this an exact match
  # so it wins over the prefix `location /`. The video asset next to it
  # (flowah_bday.mp4) has a real extension and is served fine by `location /`.
  location = /others/vinoly/2026_bday_invitation {
    root /usr/share/nginx/html;
    default_type text/html;
    try_files /others/vinoly/2026_bday_invitation.html =404;
  }

  # 301 redirects for renamed routes. Preserve bookmarks and the Cloudflare
  # cache when a page URL changes. Add one line per rename; the Vue catch-
  # all in src/router/router.js handles unknown paths that don't match here.
  rewrite ^/trusted/pappas-armhavningar/?$ /trusted/pappas-pushups permanent;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}

# home.the-aspirant.com is the DIRECT, un-proxied hostname (system_3 #2557).
#
# It exists so SSH can reach the cell on 41922 without Cloudflare in the path,
# which means its A record points at the origin IP and any HTTP request to it
# arrives here having never touched Cloudflare's TLS. It therefore carries no
# X-Forwarded-Proto, so the upgrade added for #2463 deliberately skips it (that
# carve-out exists so container healthchecks are not redirected) — and the
# result was `http://home.the-aspirant.com/login` serving a 200 login form in
# cleartext, with Login.vue posting to a relative /api/login. A password typed
# there goes on the wire in the clear.
#
# There is no legitimate HTTP use of this hostname: it is the SSH entry point.
# So serve nothing over it — send every request to the apex over TLS.
#
# This is Host-based, so it does NOT touch the healthcheck carve-out: probes
# arrive with Host: localhost (or the container name) and continue to hit the
# default_server unredirected. Verified in the test plan.
#
# RESIDUAL, not closed here: a request to the origin IP with any other Host
# still lands on the default_server over plaintext. That is a network-boundary
# problem — the origin should not accept :80 from anything but Cloudflare — and
# it cannot be fixed in nginx, which is downstream of the connection being
# accepted. This block closes the discoverable, named path.
server {
  listen 80;
  server_name home.the-aspirant.com;

  # 301 rather than 308: these are GETs of a page, and a permanent redirect lets
  # browsers stop issuing the cleartext request at all after the first hit.
  return 301 https://the-aspirant.com$request_uri;
}

# Former Penpot vhost (system_3 #2195). Penpot moved to the same-origin
# /admin/penpot/app/ path above (#2198, operator direction) so it rides the
# apex's proven TLS/auth boundary instead of a second origin. The subdomain
# remains a plain redirect; the fragment (workspace deep links) survives the
# 302 because browsers re-apply it to the redirect target.
server {
  listen 80;
  server_name design.the-aspirant.com;

  location / {
    return 302 https://the-aspirant.com/admin/penpot/;
  }
}