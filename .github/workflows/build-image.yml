# Build and push the aspirant-client image to GHCR on every push to main.
# Test/validation is local-only (per #107 strip of ci.yml); this workflow
# carries ONLY the build+push half so the deploy pipeline isn't blocked.

name: Build Image

on:
  push:
    branches: [main]

# Serialize builds per ref, as aspirant-server does since its #4761. On
# 2026-11-05 five merges landed within 90s and 32f030a's build finished last,
# so :latest went back to it and the site lost #404 and #405 (system_3 #9966).
# cancel-in-progress: false queues a run behind the one in flight, and a newer
# pending run replaces an older pending one, so the last run is the newest
# push. Every run that does start still pushes its own sha- tag.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    # Two checkouts into sibling paths, reproducing the on-disk layout
    # Dockerfile-Client documents (/src/aspirant-client next to
    # /src/aspirant-design-system) so the `file:../aspirant-design-system`
    # specifier and its package-lock.json entry both resolve unchanged.
    - name: Check out aspirant-client
      uses: actions/checkout@v4
      with:
        path: aspirant-client
    # Build-integrity backstop (not a test suite — those stay local per #107):
    # fail loudly if a node_modules path or a symlink targeting node_modules was
    # committed, which breaks every fresh checkout / npm ci / vite build / this
    # image build. See the #191/#4288 incident and scripts/ header.
    - name: Guard against tracked node_modules
      working-directory: aspirant-client
      run: bash scripts/check-no-tracked-node-modules.sh
    # Dockerfile-Client compiles the design system FROM SOURCE via a BuildKit
    # named build context called `designsystem` (see that file's header). CI
    # never supplied it, so BuildKit fell back to treating `designsystem` as an
    # image reference and failed with a misleading "docker.io/library/
    # designsystem:latest pull access denied" — the ~19-day-broken build this
    # step fixes (#3013). aspirant-design-system is public, so a plain checkout
    # suffices — no token or deploy key.
    #
    # Ref pinning: we deliberately track DS `main`. The local dev build resolves
    # `file:../aspirant-design-system` — whatever DS working tree sits beside the
    # client — so tracking main keeps the CI image and the dev build compiling
    # the SAME DS source, which is exactly the "works locally vs works in the
    # image" divergence Dockerfile-Client's header exists to prevent. Pinning to
    # a tag/SHA would be more reproducible but (a) there is no DS release/bump
    # process yet and (b) it would routinely ship a DS older than the sibling dev
    # checkout, re-introducing that divergence. Revisit if/when the DS gains
    # tagged releases.
    - name: Check out aspirant-design-system (the `designsystem` build context)
      uses: actions/checkout@v4
      with:
        repository: the-anonymous-aspirant/aspirant-design-system
        ref: main
        path: aspirant-design-system
    # The concurrency group orders pushes, but a re-run of an older run joins
    # the same queue and would still retag :latest with its older commit,
    # rolling the site back (system_3 #9966). So the moving tags (:latest,
    # :main) go only on a build of the commit that is main's head right now;
    # any other build still pushes its sha- tag. If the head cannot be read,
    # the build fails rather than guessing either way.
    - name: Is this commit main's head?
      id: head
      working-directory: aspirant-client
      run: bash scripts/is-main-head.sh "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch,enable=${{ steps.head.outputs.is_head == 'true' }}
          type=sha
          type=raw,value=latest,enable=${{ steps.head.outputs.is_head == 'true' }}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: aspirant-client
        file: aspirant-client/Dockerfile-Client
        # Supplies the `designsystem` named context Dockerfile-Client requires.
        build-contexts: |
          designsystem=aspirant-design-system
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
